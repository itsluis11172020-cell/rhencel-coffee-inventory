<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rhencel Coffee Shop - Inventory Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div id="loginPage" class="login-page">
      <div class="login-card">
        <div class="login-header">
          <div class="login-logo"><i class="bi bi-cup-hot-fill"></i></div>
          <h1>Rhencel Coffee Shop</h1>
          <p>Inventory Management System</p>
        </div>
        <div id="loginAlert"></div>
        <form id="loginForm" autocomplete="off">
          <div class="mb-3">
            <label class="form-label">Username or Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="loginUsername" placeholder="Enter username" required />
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="loginPassword" placeholder="Enter password" required />
              <button class="btn btn-outline-secondary" type="button" id="togglePw"><i class="bi bi-eye"></i></button>
            </div>
          </div>
          <button type="submit" class="btn btn-login w-100">
            <i class="bi bi-box-arrow-in-right"></i> Login
          </button>
        </form>
        <div class="demo-creds">
          <strong>Demo Accounts:</strong><br />
          Owner: <code>admin</code> / <code>Admin@123</code><br />
          Staff: <code>staff</code> / <code>Staff@123</code>
        </div>
      </div>
    </div>

    <div id="app" class="hidden">
      <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <i class="bi bi-cup-hot-fill"></i><span>Rhencel Inventory</span>
        </div>
        <ul class="sidebar-nav">
          <li><a data-page="dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
          <li><a data-page="products"><i class="bi bi-box-seam"></i> Products &amp; Supplies</a></li>
          <li><a data-page="transactions"><i class="bi bi-arrow-left-right"></i> Stock Transactions</a></li>
          <li><a data-page="inventory"><i class="bi bi-clipboard-data"></i> Inventory Monitoring</a></li>
          <li><a data-page="reports"><i class="bi bi-file-earmark-bar-graph"></i> Reports</a></li>
          <li id="navUsers"><a data-page="users"><i class="bi bi-people"></i> User Management</a></li>
        </ul>
        <div class="sidebar-footer">
          <div class="user-info">
            <i class="bi bi-person-circle"></i>
            <div><strong id="sidebarName">User</strong><small id="sidebarRole">Role</small></div>
          </div>
          <button class="btn btn-outline-light btn-sm w-100" onclick="Auth.logout()">
            <i class="bi bi-box-arrow-right"></i> Logout
          </button>
        </div>
      </nav>

      <main class="main-content">
        <header class="topbar">
          <button id="sidebarToggle"><i class="bi bi-list"></i></button>
          <h1 class="page-title" id="pageTitle">Dashboard</h1>
          <span class="text-muted d-none d-md-inline"><i class="bi bi-calendar3"></i> <span id="todayDate"></span></span>
        </header>
        <div class="content-wrapper" id="content"></div>
      </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="modal fade" id="appModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Modal</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="modalBody"></div>
          <div class="modal-footer" id="modalFooter"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>
